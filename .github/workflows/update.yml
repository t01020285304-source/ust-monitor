# 국채 위기 모니터 데이터를 새로 만들어 data 브랜치에 올림 (공개 저장소면 무료)
# GitHub는 바쁠 때 예약 실행을 미루거나 건너뜀(실측: 20분 간격 예약이 하루 5번 남짓만 실행)
# → 평일 실행은 한 번 시작하면 약 5시간 동안 15분마다 스스로 다시 만들어 올림(builder/loop.sh). 다음 예약은 이 실행이 끝나면 이어서 시작.
# 주말은 하루 2번 한 번씩만.
# 시간은 UTC 기준
name: 데이터 갱신

on:
  schedule:
    - cron: "7,27,47 * * * 1-5"
    - cron: "17 0,12 * * 0,6"
  workflow_dispatch: {}        # Actions 탭에서 'Run workflow'로 바로 실행

permissions:
  contents: write

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350          # 반복 실행 최대 약 5시간 50분 (GitHub 한도 6시간)
    steps:
      - uses: actions/checkout@v4

      - name: 지난 데이터·캐시 가져오기 (data 브랜치)
        run: |
          git fetch origin data --depth=1 || true
          mkdir -p out builder/data
          if git rev-parse --verify -q origin/data >/dev/null; then
            git --work-tree=out checkout origin/data -- . || true
            git reset -q
            [ -d out/cache ] && cp -r out/cache builder/data/ || true
          fi
          # 복원한 캐시는 '오래된 것'으로 표시 → 매번 새로 받고, 받기에 실패한 FRED 자료만 예비로 씀
          find builder/data -type f -exec touch -d '2000-01-01' {} + || true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 데이터 만들기 · 올리기 (평일은 약 5시간 동안 15분마다 반복)
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}   # 저장소 Settings → Secrets and variables → Actions 에 등록
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 평일 예약·수동 실행은 반복(GitHub가 예약을 건너뛰어도 갱신이 끊기지 않게), 주말은 한 번만
          LOOP_MIN: ${{ (github.event_name == 'schedule' && github.event.schedule == '17 0,12 * * 0,6') && '0' || '320' }}
        run: bash builder/loop.sh

  # GitHub는 60일 동안 저장소에 활동이 없으면 예약 실행을 멈춤 → 매달 첫 주말 main 에 빈 커밋으로 깨워 둠
  keepalive:
    if: github.event.schedule == '17 0,12 * * 0,6'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 매달 첫 주말 활동 기록
        run: |
          if [ "$(date -u +%d)" -le "07" ] && [ "$(date -u +%H)" = "00" ]; then
            git config user.name "ust-monitor-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -q -m "keepalive: 예약 실행 유지"
            git push -q
          fi
